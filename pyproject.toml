[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenix-chronos"
version = "0.1.0"
description = "The Open-Source Checkpoint & Replay Engine for Developers"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "Phoenix Chronos Contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Standard library is preferred, but standard click/colorama or simple rich could be useful.
    # We will implement with zero non-standard runtime requirements if possible for maximum portability (e.g. Termux/Linux).
]

[project.scripts]
chronos = "chronos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
